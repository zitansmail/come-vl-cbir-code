[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "come-cbir"
version = "1.0.0"
description = "CBIR extraction/evaluation pipeline, ARP/ARP-NP adapter, and graph-fusion validation study accompanying the CoME-VL open-set CBIR article"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Smail Zitane", email = "zitansmail@gmail.com" },
    { name = "Imad Zeroual", email = "mr.imadine@gmail.com" },
    { name = "Said Agoujil", email = "agoujil@gmail.com" },
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "torch",
    "torchvision",
    "Pillow",
    "PyYAML",
    "faiss-cpu",
    "annoy",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/zitansmail/come-vl-cbir-code"
"Base model (CoME-VL)" = "https://github.com/mbzuai-oryx/CoME-VL"

[tool.setuptools.packages.find]
include = ["come_cbir*"]
